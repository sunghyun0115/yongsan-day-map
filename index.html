<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>용산 하루 코스</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #f7f4ef; }
    #kakaomap { width: 100%; height: 500px; }
    .course {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #e2dbd2;
    }
    .course-item span {
      background: #fdf3e9;
      color: #c4956a;
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 11px;
    }
    .arrow { color: #c4956a; font-size: 10px; display: flex; align-items: center; }
  </style>
</head>
<body>

<div id="kakaomap"></div>

<div class="course">
  <div class="course-item"><span>① 한땀스시</span></div>
  <div class="arrow">→</div>
  <div class="course-item"><span>② 용산전자랜드</span></div>
  <div class="arrow">→</div>
  <div class="course-item"><span>③ 스타벅스</span></div>
  <div class="arrow">→</div>
  <div class="course-item"><span>④ 잭슨피자</span></div>
  <div class="arrow">→</div>
  <div class="course-item"><span>⑤ 이촌한강공원</span></div>
</div>

<script>
  function initMap() {
    const container = document.getElementById('kakaomap');
    const map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(37.5255, 126.9660),
      level: 5
    });

    const places = [
      { lat: 37.5274286, lng: 126.9655975, name: '① 한땀스시', desc: '단골 초밥집' },
      { lat: 37.5333623, lng: 126.9589872, name: '② 용산전자랜드 신관', desc: '구경' },
      { lat: 37.5327611, lng: 126.9610377, name: '③ 스타벅스 ET랜드점', desc: '카페 + 닌텐도' },
      { lat: 37.5238985, lng: 126.9712670, name: '④ 잭슨피자 이촌점', desc: '피자가 너무 작았다' },
      { lat: 37.5169202, lng: 126.9717022, name: '⑤ 이촌한강공원', desc: '마지막 산책' },
    ];

    new kakao.maps.Polyline({
      map,
      path: places.map(p => new kakao.maps.LatLng(p.lat, p.lng)),
      strokeWeight: 3,
      strokeColor: '#c4956a',
      strokeOpacity: 0.9,
      strokeStyle: 'solid'
    });

    places.forEach(place => {
      const marker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(place.lat, place.lng),
        map
      });
      const infowindow = new kakao.maps.InfoWindow({
        content: `<div style="padding:8px 12px;font-size:12px;line-height:1.6;">
          <strong style="color:#c4956a;">${place.name}</strong><br>
          <span style="color:#8a7f74;">${place.desc}</span>
        </div>`
      });
      kakao.maps.event.addListener(marker, 'mouseover', () => infowindow.open(map, marker));
      kakao.maps.event.addListener(marker, 'mouseout', () => infowindow.close());
    });
  }
</script>

<!-- 스크립트를 body 맨 끝에, onload 콜백 방식으로 -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=694fefef27710378fe1efb37fac3e1b3&onload=initMap"></script>

</body>
</html>
